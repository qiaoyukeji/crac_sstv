# CRAC SSTV · Android 构建属性
#
# 内存：AGP 8.5 + Kotlin 编译峰值约 1.5–2 GB。CI 构建机规格未知，
# 因此把堆上限压在 2 GB 并关闭并行，用少量构建时长换"不会 OOM 失败"。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.configuration-cache=false
org.gradle.warning.mode=all

# AndroidX 必须开启 —— WebViewAssetLoader 来自 androidx.webkit
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official

# AGP 默认拒绝任何含非 ASCII 字符的工程路径，理由是 aapt2/R8 在这种路径下可能出问题。
# 但国内开发者的工作目录带中文太常见了（本仓库自己就在一个中文路径下），一直红着没法用；
# 这里放行，让带中文路径的机器也能构建。CI 上是 /root/workspace/<owner>/<repo>，纯 ASCII，
# 这一行对 CI 没有任何影响。
android.overridePathCheck=true
